<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good Dog: A Life in Choices</title>
<style>
:root{--bg:#fdf6e9;--card:#fff;--tx:#2b2118;--mut:#7a6a58;--ac:#d9822b;--ln:#ead9bf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--card:#2a221a;--tx:#f3e8d6;--mut:#b5a58f;--ac:#f0a050;--ln:#43372a}}
:root[data-theme="dark"]{--bg:#1c1712;--card:#2a221a;--tx:#f3e8d6;--mut:#b5a58f;--ac:#f0a050;--ln:#43372a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:0 0 8px}
.mut{color:var(--mut);font-size:14px}
.big{font-size:56px;text-align:center;line-height:1.1}
button{font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--ln);border-radius:12px;padding:12px 14px;width:100%;text-align:left;margin-top:8px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--ac);outline:none}
button.p{background:var(--ac);color:#201408;border-color:var(--ac);text-align:center;font-weight:600}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:2px solid var(--ln);background:var(--bg);color:var(--tx)}
.st{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.res{border-left:4px solid var(--ac);padding-left:12px;margin:10px 0}
ul{padding-left:18px;margin:6px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
"use strict";
var STATS={h:["❤️","Health"],j:["🎾","Joy"],b:["🤝","Bond"],w:["🧠","Wits"]};
var TRAITS={Brave:{w:10},Cuddly:{b:10},Playful:{j:10},Sturdy:{h:10}};
var BODIES=["Scrappy mutt","Fluffy herder","Stubby lap dog","Leggy sprinter"];
var ROUNDS=16;
// c: [label, effects{h,j,b,w}, result, memory]
var EV=[
{s:"p",t:"You find a basket of socks. Each one smells like your human.",c:[["Chew them all",{j:10,w:-3,b:-4},"Joyful, damp, and slightly illegal.","Destroyed a whole sock collection"],["Carry one to your human",{b:10,j:3},"They laugh and call you the best helper ever.","Became a professional sock courier"],["Nap on them",{h:4,j:4},"Comfort level: maximum."]]},
{s:"p",t:"A loud machine on wheels rolls out of the closet. It roars!",c:[["Bark at it until it leaves",{w:6,j:3},"It stops. You clearly won.","Defeated the Roaring Machine"],["Hide under the sofa",{w:-2,b:2},"Safe, but your pride is a bit dusty."],["Sniff it carefully",{w:8},"It smells like dust and old crumbs. Fascinating."]]},
{s:"p",t:"Your very first walk! The world is HUGE and smells amazing.",c:[["Pull toward every smell",{j:8,b:-3,w:4},"Your human is dragged along like a sled."],["Walk close by their side",{b:9,w:3},"They tell the neighbours how well-behaved you are.","Mastered the loose leash"],["Roll in something mysterious",{j:6,h:-4},"You smell extraordinary. Bath time follows."]]},
{s:"p",t:"A stranger on the sidewalk waves a treat and says hello.",c:[["Run up for the treat",{j:5,w:-4},"Tasty, but your human looks nervous."],["Check with your human first",{b:6,w:6},"Wise puppy. They nod and let you have it."],["Sit and wiggle politely",{j:6,b:3,w:3},"Charm offensive complete."]]},
{s:"p",t:"There is a deep, glorious mud puddle after the rain.",c:[["Jump right in",{j:10,h:-3,b:-2},"Splash! You are now a brown dog.","Became one with the mud"],["Stay clean",{b:3,h:2},"Clean, but did you really live?"]]},
{s:"y",t:"A squirrel dashes across the yard and up a tree.",c:[["Chase it at full speed",{j:9,h:-3},"You did not catch it, but you almost did!","Lost a race to a squirrel"],["Guard the tree base",{w:5,j:3},"Patience. The squirrel will return."],["Ignore it with great dignity",{b:4,w:3},"The squirrel is confused by your calm."]]},
{s:"y",t:"At the dog park, a bigger dog trots off with your favourite ball.",c:[["Challenge them",{w:-4,j:2,h:-5},"Lots of growling, no ball, one scratch."],["Offer a play-bow",{j:8,w:6},"Turns out they just wanted a friend!","Made a best friend at the park"],["Fetch a stick instead",{j:5,w:4},"A stick is a ball with ambition."]]},
{s:"y",t:"The kitchen trash can is open. It smells like a feast.",c:[["Dive in",{j:8,h:-8,b:-4},"Delicious. Your tummy disagrees."],["Tip it gently, take only the best bits",{j:4,h:-3,w:5},"A refined thief."],["Fetch your human to show them",{b:9,w:4},"Honesty rewarded with a proper snack."]]},
{s:"y",t:"A trainer offers a class: sit, stay, and come.",c:[["Try your best",{w:10,b:6},"You learn fast and love the treats.","Graduated obedience class"],["Clown around",{j:9,w:2,b:-2},"Everyone loves you. The trainer sighs."],["Skip, nap instead",{h:3,w:-3},"Napping is also a skill."]]},
{s:"y",t:"Thunder rumbles outside. The windows rattle.",c:[["Hide in the bathtub",{h:2,w:-1},"A strange but effective bunker."],["Press against your human",{b:10},"They stroke your ears until the storm passes.","Weathered a storm together"],["Bark at the sky",{w:3,j:2,b:-3},"The sky does not answer."]]},
{s:"y",t:"Somebody left the front door open just a crack.",c:[["Slip out for an adventure",{j:10,h:-6,w:3},"You explore, return a bit muddy, and very proud.","Escaped on a secret adventure"],["Alert your human",{b:8,w:5},"They close it and thank you."],["Sit in the doorway and watch",{w:4,j:3},"The world comes to you."]]},
{s:"a",t:"Your human brings home a small, judgmental cat.",c:[["Be friendly",{j:6,b:4,w:3},"Slowly, the cat accepts you. Sort of.","Befriended a very picky cat"],["Defend your territory",{w:-2,b:-5,h:-2},"Hisses. Lots of hisses."],["Share your bed",{b:8,j:4,h:-2},"You now have a roommate, and fur everywhere."]]},
{s:"a",t:"Boxes everywhere. You are moving to a new home!",c:[["Help by carrying small things",{b:8,w:3},"Dedicated moving assistant."],["Explore every new corner",{j:8,w:6},"You find the best sunny spot on the first day.","Found the best sunny spot in the new home"],["Stay worried near the door",{b:3,j:-4},"It feels odd, but your human reassures you."]]},
{s:"a",t:"Your human sits on the floor, quiet and teary-eyed.",c:[["Rest your head on their knee",{b:12,j:-1},"They hug you for a long time.","Comforted my human on a hard day"],["Bring your favourite toy",{b:8,j:4},"A squeaky distraction. It works a bit."],["Wait and watch",{w:4,b:3},"Sometimes being there is enough."]]},
{s:"a",t:"A family trip to the beach! Waves, sand, seagulls.",c:[["Race the waves",{j:12,h:3},"Joy is the sound of splashing.","Raced the ocean and won"],["Dig a huge hole",{j:8,w:3,h:-1},"An excellent hole. A masterpiece."],["Bark at the seagulls",{j:5,w:-2},"They are unimpressed."]]},
{s:"a",t:"A steak rests on the counter. Unattended. Glowing.",c:[["Steal it",{j:12,h:-6,b:-8},"Worth it? Your tummy and your human have opinions.","Stole a steak, regretted a little"],["Sit politely beside it",{b:10,w:6,j:2},"Your human is moved and gives you a bite.","Resisted the steak (almost)"],["Look at it very hard",{w:3,j:-1},"It does not move."]]},
{s:"a",t:"There is a gap in the fence. A friendly dog lives next door.",c:[["Squeeze through to say hi",{j:10,b:-3,h:-2},"A secret friendship begins.","Made a secret fence friend"],["Say hi through the fence",{j:6,w:4},"Safe and sweet."],["Ignore it",{b:3},"You are a responsible dog."]]},
{s:"a",t:"Time for the vet. The car smells like worry.",c:[["Be brave",{h:7,b:5,w:3},"The vet says you are a great patient.","Aced the vet check-up"],["Refuse to leave the car",{b:-2,h:-2,j:-2},"Eventually, treats win."],["Lean on your human",{b:10,h:3},"Nothing scary with them nearby."]]},
{s:"s",t:"The stairs feel steeper than they used to be.",c:[["Take them slowly",{h:3,w:5},"Slow and steady, like wine and cheese."],["Ask to be carried",{b:9,h:2},"You love being lifted. They love lifting you.","Got carried up the stairs, again"],["Nap at the bottom",{h:4,j:-1},"A fine view from here."]]},
{s:"s",t:"A bouncy neighbour puppy wants to play with you.",c:[["Teach them manners",{w:8,j:4,b:2},"You become a legend of the street.","Mentored a neighbourhood puppy"],["Play gently",{j:9,h:-1},"Your tail wags like it is young again."],["Walk away to rest",{h:4,j:-4},"You deserve your quiet."]]},
{s:"s",t:"A patch of sunlight lands on your favourite rug.",c:[["Stretch out and enjoy it",{h:5,j:6},"Warm, golden, perfect.","Perfected the art of sunbathing"],["Share it with your human",{b:12,j:3},"They sit down on the floor beside you."]]},
{s:"s",t:"On a slow walk, you pass the park from your puppy days.",c:[["Sniff every corner",{j:8,w:5},"Memories drift in with every scent.","Revisited the old park, remembered everything"],["Lead the way home",{b:8,w:3},"They follow. You know best."],["Just sit and watch the kids play",{j:6,b:5},"Life has been good."]]},
{s:"a",t:"Doorbell! A delivery person with a mysterious box.",c:[["Bark a warning",{w:4,j:3,b:-2},"Box delivered, duty performed."],["Wag and greet",{j:7,b:3},"They pet you and call you a good dog."],["Hide behind the couch",{w:-1,b:2},"Not your finest hour."]]},
{s:"a",t:"It is a rainy day, and nothing is happening.",c:[["Cuddle on the couch",{b:8,h:2,j:3},"Rain on the window, warmth at your side."],["Zoom around the house",{j:9,w:-2,h:-2},"The living room has never seen such speed."],["Watch the rain",{w:5,j:1},"Every drop is a story."]]},
{s:"a",t:"Someone starts a belly rub. This could last forever.",c:[["Melt into the floor",{j:9,b:6,h:2},"Pure bliss.","Reached enlightenment via belly rub"],["Ask for more with a paw",{b:7,j:5,w:3},"Excellent negotiation skills."]]}
];
var S,app=document.getElementById("app"),setup={name:"Buddy",trait:"Playful",body:BODIES[0]};
function clamp(n){return Math.max(0,Math.min(100,n))}
function stage(r){return r<=3?"p":r<=7?"y":r<=12?"a":"s"}
function stageName(r){return {p:"Puppy",y:"Young dog",a:"Grown dog",s:"Senior dog"}[stage(r)]}
function age(r){return (r*0.8).toFixed(1)}
function bars(){var h="<div class='st'>";for(var k in STATS){h+="<span>"+STATS[k][0]+" "+STATS[k][1]+"</span><div class='bar'><i style='width:"+S.st[k]+"%'></i></div><span>"+S.st[k]+"</span>"}return h+"</div>"}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function start(){
 var st={h:60,j:60,b:60,w:60},t=TRAITS[setup.trait];
 for(var k in t)st[k]=clamp(st[k]+t[k]);
 S={name:setup.name||"Buddy",body:setup.body,trait:setup.trait,st:st,round:0,used:[],mem:[],ev:null,res:null,over:false};
 next();
}
function next(){
 S.round++;S.res=null;
 if(S.round>ROUNDS||S.st.h<=0){S.over=true;return render()}
 var pool=[],i;
 for(i=0;i<EV.length;i++){if(S.used.indexOf(i)<0&&(EV[i].s===stage(S.round)||(EV[i].s==="a"&&stage(S.round)!=="p")))pool.push(i)}
 if(!pool.length){S.used=[];return next()}
 var pick=pool[Math.floor(Math.random()*pool.length)];
 S.used.push(pick);S.ev=EV[pick];render();
}
function choose(i){
 var c=S.ev.c[i],e=c[1];
 for(var k in e)S.st[k]=clamp(S.st[k]+e[k]);
 if(c[3])S.mem.push(c[3]);
 S.res=c[2];render();
}
function ending(){
 var s=S.st,best="h",k;for(k in s)if(s[k]>s[best])best=k;
 var titles={h:"The Iron Pup",j:"The Joy Machine",b:"The Loyal Heart",w:"The Wise Old Dog"};
 var line=S.st.h<=0?"Your adventures were big, and your heart was bigger. You rest now, loved by all who knew you.":"You lived a full, happy life, and slept soundly at the end, with your human by your side.";
 return {title:titles[best],line:line};
}
function render(){
 var h="";
 if(!S){
  h="<div class='card'><div class='big'>🐕</div><h1>Good Dog</h1><p class='mut'>A little life story in choices. Pick a name and a personality, then live a dog’s whole life, from puppy to old age.</p>"+
  "<label class='mut'>Name</label><input id='nm' maxlength='16' value='"+esc(setup.name)+"'>"+
  "<p class='mut' style='margin-bottom:0'>Personality</p>";
  for(var t in TRAITS)h+="<button data-t='"+t+"' "+(setup.trait===t?"style='border-color:var(--ac)'":"")+">"+t+"</button>";
  h+="<p class='mut' style='margin-bottom:0'>Build</p>";
  BODIES.forEach(function(b){h+="<button data-b='"+b+"' "+(setup.body===b?"style='border-color:var(--ac)'":"")+">"+b+"</button>"});
  h+="<button class='p' id='go' style='margin-top:14px'>Begin life 🐾</button></div>";
  app.innerHTML=h;
  app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){setup.name=document.getElementById("nm").value;setup.trait=b.dataset.t;render()}});
  app.querySelectorAll("[data-b]").forEach(function(b){b.onclick=function(){setup.name=document.getElementById("nm").value;setup.body=b.dataset.b;render()}});
  document.getElementById("go").onclick=function(){setup.name=document.getElementById("nm").value.trim()||"Buddy";start()};
  return;
 }
 if(S.over){
  var en=ending();
  h="<div class='card'><div class='big'>🌈</div><h1>"+esc(S.name)+": "+en.title+"</h1><p class='mut'>Lived "+age(Math.min(S.round-1,ROUNDS))+" years as a "+esc(S.trait.toLowerCase())+" "+esc(S.body.toLowerCase())+".</p><p>"+en.line+"</p>"+bars()+"</div>";
  h+="<div class='card'><h2>Life memories</h2>"+(S.mem.length?"<ul>"+S.mem.map(function(m){return "<li>"+esc(m)+"</li>"}).join("")+"</ul>":"<p class='mut'>A quiet life, and that is okay.</p>")+"</div>";
  h+="<button class='p' id='again'>Live another life 🐾</button>";
  app.innerHTML=h;document.getElementById("again").onclick=function(){S=null;render()};return;
 }
 h="<div class='card'><h2>"+esc(S.name)+" · "+stageName(S.round)+" · "+age(S.round)+" yrs</h2>"+bars()+"</div>";
 h+="<div class='card'><p style='margin-top:0'>"+S.ev.t+"</p>";
 if(S.res===null){S.ev.c.forEach(function(c,i){h+="<button data-i='"+i+"'>"+c[0]+"</button>"})}
 else{h+="<div class='res'>"+S.res+"</div><button class='p' id='nx'>Continue</button>"}
 h+="</div>";
 app.innerHTML=h;
 app.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){choose(+b.dataset.i)}});
 var nx=document.getElementById("nx");if(nx)nx.onclick=next;
}
render();
})();
</script>
</body>
</html>
